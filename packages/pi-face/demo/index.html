<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Agent Face — Canvas reference</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #070a10; color: #e9f1ff; display: grid; place-items: center; }
    main { width: min(1120px, 100%); padding: 28px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.8rem); line-height: .9; letter-spacing: -.06em; }
    .lede { max-width: 38rem; margin: 12px 0 0; color: #91a4bf; font-size: 1.05rem; }
    .badge { border: 1px solid #28405f; border-radius: 999px; padding: 8px 12px; color: #8ed8ff; white-space: nowrap; }
    .stage { position: relative; overflow: hidden; min-height: 570px; border: 1px solid #1c2a3d; border-radius: 28px; background: radial-gradient(circle at 50% 40%, #12243a 0, #0a111d 44%, #070a10 76%); box-shadow: 0 32px 100px #0009; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hud { position: absolute; inset: 0; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .status { display: flex; justify-content: space-between; gap: 16px; color: #92a7c2; font: 600 13px/1.4 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .12em; }
    .status strong { color: #dff7ff; }
    .controls { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 8px; }
    button { appearance: none; border: 1px solid #28405f; background: #0d1828cc; color: #ccecff; padding: 10px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; backdrop-filter: blur(12px); }
    button:hover { border-color: #62cafc; background: #142942; }
    button.primary { background: #d8f5ff; border-color: #d8f5ff; color: #071019; }
    button.sal { border-color: #8067e8; background: linear-gradient(110deg, #6d55d8cc, #173d58cc); color: #f1edff; }
    button:disabled { opacity: .48; cursor: wait; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 14px; color: #62738a; font-size: .9rem; }
    code { color: #9cddff; }
    @media (max-width: 700px) { main { padding: 14px; } header { align-items: start; flex-direction: column; } .stage { min-height: 620px; } .status { flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) { .badge::after { content: " · reduced motion respected"; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Give any agent<br>a face.</h1>
        <p class="lede">A living face that emerges from truthful lifecycle events, speaks through motion, and transforms into tools.</p>
      </div>
      <div class="badge">Canvas reference adapter</div>
    </header>
    <section class="stage" aria-label="Animated agent face demo">
      <canvas id="face"></canvas>
      <div class="hud">
        <div class="status">
          <span>state <strong id="state">idle</strong></span>
          <span>motif <strong id="motif">none</strong></span>
          <span>event <strong id="event">reset</strong></span>
          <span>seed <strong id="seed">—</strong></span>
        </div>
        <div class="controls">
          <button class="primary" data-action="story">Play full story</button>
          <button data-action="speak">Motion preview</button>
          <button class="sal" data-action="sal">Speak with Sal</button>
          <button data-action="form">Cat form</button>
          <button data-tool="bash">Hammer</button>
          <button data-tool="read">Lens</button>
          <button data-tool="edit">Pencil</button>
          <button data-tool="multi_tool_use.parallel">Network</button>
          <button data-tool="custom_operation">Gear</button>
          <button data-action="wait">Wait</button>
          <button data-action="error">Error</button>
          <button data-action="collective">Multi-agent lab</button>
          <button data-action="reset">Reset</button>
        </div>
      </div>
    </section>
    <footer>
      <span>Shared engine: <code>src/presence.ts</code></span>
      <span>Particles are normalized from 0–1 for any renderer.</span>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
