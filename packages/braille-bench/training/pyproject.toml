[tool.poetry]
name = "cerebraille-training"
version = "0.1.0"
description = "PyTorch training scaffold for Cerebraille symbolic codecs"
authors = ["Ryan Barrett"]
readme = "README.md"
packages = [{ include = "cerebraille_training" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = "^2.3.0"
numpy = "^1.26.4"
pydantic = "^2.7.0"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.4.0"

[tool.poetry.scripts]
cerebraille-train = "cerebraille_training.train:main"
cerebraille-export = "cerebraille_training.export_dataset:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
