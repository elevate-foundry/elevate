[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "famulus"
version = "0.0.1"
description = "Offline-by-default, consent-bound local agent engine wrapping Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# NOTE: Phase -1 (famulus/bootstrap, famulus/safety) uses ZERO third-party deps
# by design -- it must run before any of these are installed. The deps below are
# for Phase 0+ and are installed only AFTER Ollama is up.
dependencies = []

[project.optional-dependencies]
viz = ["flask>=2.3"]
engine = [
  "ollama>=0.3",
  "httpx>=0.27",
  "psutil>=5.9",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "mcp>=1.0",
]
search = ["pymupdf>=1.24"]
ocr = ["pytesseract>=0.3.10"]
audio = ["faster-whisper>=1.0"]
hardware = ["pyserial>=3.5", "pyusb>=1.2"]
vision = ["opencv-python>=4.9"]
gui = ["pyautogui>=0.9.54"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
famulus = "famulus.cli:main"

[tool.setuptools]
packages = ["famulus", "famulus.bootstrap", "famulus.safety", "famulus.engine", "famulus.viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["famulus"]
branch = true

[tool.coverage.report]
show_missing = true
# Per-job floor. Single-OS runs cannot hit the OS-specific probe branches, so
# this is intentionally conservative; the CI matrix exercises the rest.
fail_under = 80
