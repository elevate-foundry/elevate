# LoRA fine-tune configuration for the elevate-foundry code corpus.
# Override any field on the CLI, e.g.  python train_lora.py --epochs 2 --bf16

# --- data (produced by prepare_dataset.py) ---
train_file: data/train.jsonl
val_file: data/val.jsonl
text_field: text

# --- base model ---
base_model: Qwen/Qwen2.5-1.5B        # small, strong on code+text; swap for Llama-3.2-1B etc.
block_size: 2048                     # tokens per packed training example

# --- LoRA ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:                      # attention + MLP projections (Qwen2/Llama family)
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- training ---
output_dir: out/lora-elevate
per_device_batch_size: 1
grad_accum: 16
learning_rate: 0.0002
epochs: 3
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 10
save_steps: 200
seed: 42
bf16: true
load_in_4bit: false                  # set true for QLoRA on limited VRAM (needs bitsandbytes)
gradient_checkpointing: true
